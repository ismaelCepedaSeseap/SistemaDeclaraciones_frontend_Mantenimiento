<div *ngIf="visible" class="maintenance-overlay">
  <div class="bg-pattern"></div>
  <div class="overlay-gradient"></div>

  <main class="content glass-panel" role="dialog" aria-labelledby="maintenance-title">
    <div class="brand">
      <img src="assets/pdn.png" alt="PDN" class="pdn-logo">
      <div class="brand-sub">Declaración Patrimonial<br>y de Intereses</div>
    </div>

    <div class="maintenance-icon" aria-hidden="true">
      <div class="icon-circle">
        <mat-icon class="icon">build</mat-icon>
      </div>
    </div>

    <h1 id="maintenance-title" class="title">{{ overlay.title }}</h1>
    <p class="subtitle">{{ overlay.subtitle }}</p>

    <div class="progress" aria-hidden="true">
      <div class="progress-bar"></div>
    </div>

    <div class="info-grid">
      <div class="info-box">
        <div class="label">{{ overlay.statusLabel }}</div>
        <div class="value"><span class="dot"></span>{{ overlay.statusValue }}</div>
      </div>
      <div class="info-box">
        <div class="label">{{ overlay.resumeLabel }}</div>
        <div class="value">{{ overlay.resumeValue }}</div>
      </div>
    </div>
  </main>

  <footer class="overlay-footer">Plataforma Digital Nacional © 2025</footer>
</div>
