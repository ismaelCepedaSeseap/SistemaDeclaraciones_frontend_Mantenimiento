<div *ngIf="visible" class="maintenance-banner-wrapper" role="region" aria-label="Aviso de mantenimiento">
  <div class="maintenance-banner-glass">
    <div class="glow-effect"></div>
    <div class="banner-content">
      <div class="icon-wrapper">
        <mat-icon class="icon">build_circle</mat-icon>
      </div>
      <div class="text">
        <div class="title">{{ banner.title }}</div>
        <div class="message">{{ banner.message }}</div>
      </div>
      <button *ngIf="closable" mat-icon-button aria-label="Cerrar aviso" class="close-button" (click)="dismiss()">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>
</div>
